<svg width="1120" height="640" viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef0fc"/>
      <stop offset="45%" stop-color="#f7eef7"/>
      <stop offset="100%" stop-color="#eef8f4"/>
    </linearGradient>
    <radialGradient id="hubglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7bdd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b7bdd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubfill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b7bdd"/>
      <stop offset="100%" stop-color="#6152be"/>
    </linearGradient>

    <!-- Flowing gradient for the main connector lines — a genuine gradient effect
         that changes as time passes, not just a moving dot on a flat line. Each
         path gets its own 0-100% mapping (default objectBoundingBox units), so the
         animated x1/x2 makes color sweep along every connector's own direction. -->
    <linearGradient id="flowGrad" x1="-40%" y1="0%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#8b7bdd"/>
      <stop offset="50%" stop-color="#4fcbae"/>
      <stop offset="100%" stop-color="#e3a63c"/>
      <animate attributeName="x1" values="-40%;160%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60%;260%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="640" fill="url(#bgg)"/>
  <text x="40" y="36" font-size="13" font-weight="700" letter-spacing="0.06em" fill="#6152be">ON-DEVICE MULTI-AGENT WORKFLOW</text>

  <!-- ================= connector paths (drawn first, under nodes) ================= -->
  <g fill="none" stroke="url(#flowGrad)" stroke-width="2.5">
    <path id="p-speech" d="M140,96 L140,230"/>
    <path id="p-vision" d="M140,166 L140,230"/>
    <path id="p-data-junc" d="M140,290 L260,290"/>
    <path id="p-junc-a1" d="M260,290 L415,300"/>
    <path id="p-junc-a2" d="M260,290 L585,300"/>
    <path id="p-junc-a3" d="M260,290 L755,300"/>
    <path id="p-junc-a4" d="M260,290 L925,300"/>

    <path id="p-question" d="M940,70 L940,90"/>
    <path id="p-r-a1" d="M900,175 L415,300"/>
    <path id="p-r-a2" d="M910,190 L585,300"/>
    <path id="p-r-a3" d="M965,190 L755,300"/>
    <path id="p-r-a4" d="M980,175 L925,300"/>

    <path id="p-a1-s" d="M415,346 L560,410"/>
    <path id="p-a2-s" d="M585,346 L595,398"/>
    <path id="p-a3-s" d="M755,346 L630,398"/>
    <path id="p-a4-s" d="M925,346 L660,410"/>

    <path id="p-s-answer" d="M595,522 L595,558"/>
  </g>

  <g fill="none" stroke="#a9e0cf" stroke-width="2.5" stroke-dasharray="5 5">
    <path id="p-mon-watch" d="M140,340 L140,370"/>
    <path id="p-mon-notify" d="M140,406 L140,436"/>
  </g>

  <!-- ================= traveling pulses (motion) ================= -->
  <g>
    <circle r="4" fill="#4fcbae"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#p-speech"/></animateMotion></circle>
    <circle r="4" fill="#4fcbae"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0.4s"><mpath href="#p-vision"/></animateMotion></circle>
    <circle r="4" fill="#4fcbae"><animateMotion dur="1.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#p-data-junc"/></animateMotion></circle>

    <circle r="3.5" fill="#8b7bdd"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0s"><mpath href="#p-question"/></animateMotion></circle>
    <circle r="4" fill="#6152be"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.3s"><mpath href="#p-r-a1"/></animateMotion></circle>
    <circle r="4" fill="#6152be"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.55s"><mpath href="#p-r-a2"/></animateMotion></circle>
    <circle r="4" fill="#6152be"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.8s"><mpath href="#p-r-a3"/></animateMotion></circle>
    <circle r="4" fill="#6152be"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.05s"><mpath href="#p-r-a4"/></animateMotion></circle>

    <circle r="4" fill="#e3a63c"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.9s"><mpath href="#p-a1-s"/></animateMotion></circle>
    <circle r="4" fill="#e3a63c"><animateMotion dur="2.2s" repeatCount="indefinite" begin="2.1s"><mpath href="#p-a2-s"/></animateMotion></circle>
    <circle r="4" fill="#e3a63c"><animateMotion dur="2.2s" repeatCount="indefinite" begin="2.3s"><mpath href="#p-a3-s"/></animateMotion></circle>
    <circle r="4" fill="#e3a63c"><animateMotion dur="2.2s" repeatCount="indefinite" begin="2.5s"><mpath href="#p-a4-s"/></animateMotion></circle>

    <circle r="4.5" fill="#6152be"><animateMotion dur="1.1s" repeatCount="indefinite" begin="4.2s"><mpath href="#p-s-answer"/></animateMotion></circle>
  </g>

  <g fill="none" stroke="#4fcbae" stroke-width="3" stroke-linecap="round">
    <circle r="3.5" fill="#4fcbae"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0s"><mpath href="#p-mon-watch"/></animateMotion></circle>
  </g>

  <!-- ================= nodes ================= -->

  <!-- Speech / Vision inputs -->
  <g font-size="14" font-weight="600" fill="#262340">
    <rect x="60" y="50" width="160" height="46" rx="14" fill="#ffffff" stroke="#d8d2f2"/>
    <circle cx="82" cy="73" r="5" fill="#4fcbae"/>
    <text x="150" y="78" text-anchor="middle">Speech Agent</text>
    <rect x="60" y="120" width="160" height="46" rx="14" fill="#ffffff" stroke="#d8d2f2"/>
    <circle cx="82" cy="143" r="5" fill="#4fcbae"/>
    <text x="150" y="148" text-anchor="middle">Vision Agent</text>
  </g>

  <!-- Patient data store -->
  <g font-size="14" font-weight="700" fill="#262340">
    <rect x="60" y="230" width="160" height="60" rx="14" fill="#f1eefb" stroke="#c9c1f2" stroke-width="2"/>
    <rect x="80" y="248" width="14" height="9" rx="2" fill="none" stroke="#6152be" stroke-width="1.6"/>
    <rect x="80" y="256" width="14" height="9" rx="2" fill="none" stroke="#6152be" stroke-width="1.6"/>
    <text x="150" y="256" text-anchor="middle">Patient Data</text>
    <text x="140" y="276" text-anchor="middle" font-size="11" font-weight="500" fill="#6b6690">baseline · evidence · graph</text>
  </g>

  <!-- Monitoring + Notification -->
  <g font-size="14" font-weight="600" fill="#262340">
    <rect x="60" y="360" width="160" height="46" rx="14" fill="#ffffff" stroke="#d8d2f2"/>
    <circle cx="82" cy="383" r="5" fill="#4fcbae"/>
    <text x="150" y="388" text-anchor="middle">Monitoring Agent</text>
    <rect x="60" y="436" width="160" height="46" rx="14" fill="#e7f5f1" stroke="#a9e0cf"/>
    <circle cx="82" cy="459" r="5" fill="#21826c"/>
    <text x="150" y="464" text-anchor="middle" fill="#21826c">Notification</text>
  </g>

  <!-- Question -->
  <g font-size="14" font-weight="600" fill="#262340">
    <rect x="860" y="30" width="160" height="40" rx="20" fill="#ffffff" stroke="#d8d2f2"/>
    <circle cx="882" cy="50" r="5" fill="#8b7bdd"/>
    <text x="950" y="55" text-anchor="middle">Question</text>
  </g>

  <!-- Router hub -->
  <g>
    <circle cx="940" cy="150" r="70" fill="url(#hubglow)"/>
    <circle cx="940" cy="150" r="52" fill="#ffffff" stroke="url(#hubfill)" stroke-width="3"/>
    <text x="940" y="146" text-anchor="middle" font-size="14" font-weight="800" fill="#6152be">Router</text>
    <text x="940" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#6152be">Agent</text>
  </g>

  <!-- 4 deterministic tool agents -->
  <g font-size="13.5" font-weight="700" fill="#262340">
    <rect x="340" y="300" width="150" height="46" rx="14" fill="#ffffff" stroke="#d8d2f2"/>
    <text x="415" y="328" text-anchor="middle">Progression</text>
    <rect x="510" y="300" width="150" height="46" rx="14" fill="#ffffff" stroke="#d8d2f2"/>
    <text x="585" y="328" text-anchor="middle">Evidence</text>
    <rect x="680" y="300" width="150" height="46" rx="14" fill="#ffffff" stroke="#d8d2f2"/>
    <text x="755" y="328" text-anchor="middle">Memory</text>
    <rect x="850" y="300" width="150" height="46" rx="14" fill="#ffffff" stroke="#d8d2f2"/>
    <text x="925" y="328" text-anchor="middle">Scenario</text>
  </g>
  <text x="632.5" y="292" text-anchor="middle" font-size="10.5" font-weight="700" fill="#918cb3" letter-spacing="0.05em">DETERMINISTIC — NO MODEL INVOLVED</text>

  <!-- Synthesis hub (the on-device model) -->
  <g>
    <circle cx="595" cy="460" r="80" fill="url(#hubglow)">
      <animate attributeName="r" values="75;85;75" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="595" cy="460" r="62" fill="url(#hubfill)"/>
    <text x="595" y="452" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Synthesis</text>
    <text x="595" y="470" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Agent</text>
    <text x="595" y="486" text-anchor="middle" font-size="10" font-weight="600" fill="#e4e0f9">Gemma 3n · on-device</text>
  </g>

  <!-- Answer -->
  <g font-size="14" font-weight="700" fill="#21826c">
    <rect x="525" y="558" width="140" height="42" rx="21" fill="#e7f5f1" stroke="#a9e0cf"/>
    <text x="595" y="584" text-anchor="middle">✓ Answer</text>
  </g>

  <text x="1080" y="620" text-anchor="end" font-size="10.5" font-weight="600" fill="#918cb3">source: docs/multi-agent-workflow.svg</text>
</svg>
